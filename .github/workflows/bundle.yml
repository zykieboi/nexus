name: Nexus

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundle
        run: node build.js

      - name: Verify bundle is committed
        run: |
          if ! git diff --quiet -- build/bundle.js; then
            echo "::error::build/bundle.js is out of date. Run 'node build.js' locally and commit the result."
            git --no-pager diff --stat -- build/bundle.js
            exit 1
          fi
          echo "bundle.js is up to date"
