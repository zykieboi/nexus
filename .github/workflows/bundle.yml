name: Nexus

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundle
        run: node build.js

      - name: Commit bundle
        run: |
          git config user.name "zykieboi"
          git config user.email "zykieboi@users.noreply.github.com"
          git add build/bundle.js
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "build: regenerate bundle [skip ci]"
            git push
          fi
